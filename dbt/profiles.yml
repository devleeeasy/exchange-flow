exchangeflow:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'EXCHANGEFLOW') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'EXCHANGEFLOW_WH') }}"
      schema: STAGING
      threads: 2
